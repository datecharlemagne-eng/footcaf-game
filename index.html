<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FootCAF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="label">Club</p>
          <h1 id="club-name">AS Dakar</h1>
        </div>
        <div class="stats">
          <div class="stat-card">
            <span class="label">Budget</span>
            <strong id="budget">€0</strong>
          </div>
          <div class="stat-card">
            <span class="label">Réputation</span>
            <strong id="reputation">0</strong>
          </div>
          <div class="stat-card">
            <span class="label">Moral</span>
            <strong id="morale">0%</strong>
          </div>
          <div class="stat-card">
            <span class="label">Saison</span>
            <strong id="season">2026</strong>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <section class="panel">
          <div class="panel-header">
            <h2>Équipe</h2>
            <button id="train-btn">Entraînement</button>
          </div>
          <div id="team-list" class="team-list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Compétitions</h2>
            <button id="match-btn">Jouer un match</button>
          </div>
          <div class="competition-grid">
            <div class="competition-card">
              <h3>Championnat national</h3>
              <p>Points: <strong id="league-points">0</strong></p>
              <p>Classement: <strong id="league-rank">1e</strong></p>
            </div>
            <div class="competition-card">
              <h3>Coupe CAF</h3>
              <p>Phase: <strong id="caf-stage">Quart de finale</strong></p>
              <p>Forme: <strong id="caf-form">Bonne</strong></p>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Mercato</h2>
            <button id="recruit-btn">Recruter</button>
          </div>
          <div id="market-list" class="market-list"></div>
        </section>

        <section class="panel wide">
          <div class="panel-header">
            <h2>Journal de bord</h2>
            <button id="next-day-btn">Jour suivant</button>
          </div>
          <ul id="log" class="log-list"></ul>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
